version: '3'
services:
  app01:
    container_name: api01
    build: ./api
    image: nmatsui/hello-world-api
    environment:
      - MESSAGE=${NOMBRE}+app01
    ports:
      - "3000:3000"

  app02:
      container_name: api02
      build: ./api
      image: nmatsui/hello-world-api
      environment:
        - MESSAGE=${NOMBRE}+app02
      ports:
        - "3001:3000"
  app03:
    container_name: api03
    build: ./api
    image: nmatsui/hello-world-api
    environment:
      - MESSAGE=${NOMBRE}+app03
    ports:
      - "3002:3000" 
  db:
    container_name: postgres-db
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
